services:
  hub_engine:
    build:
      context: ./projects/hub_engine
      dockerfile: Dockerfile
    container_name: hub_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Montage des docs pour que le conteneur lise les préférences Markdown locales
      - ./docs:/docs
      # Montage du code source pour le développement et l'exécution des tests à chaud
      - ./projects/hub_engine:/app
    environment:
      - DOCS_DIR=/docs
      - API_KEY=${API_KEY:-alex}
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:-alex}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_TELEGRAM_USER_ID=${ALLOWED_TELEGRAM_USER_ID}
    env_file:
      - .env
